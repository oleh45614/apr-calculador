<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор APR 💚</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5fff5;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .calculator {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: #29a329;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #248f24;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
      color: #2d862d;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>💰 Калькулятор APR</h2>
    <input type="number" id="investment" placeholder="Сума інвестиції ($)">
    <input type="number" id="apr" placeholder="APR (%)">
    <button onclick="calculateAPR()">Розрахувати</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateAPR() {
      const investment = parseFloat(document.getElementById('investment').value);
      const apr = parseFloat(document.getElementById('apr').value);

      if (isNaN(investment) || isNaN(apr)) {
        document.getElementById('result').innerText = 'Введи обидва значення 😅';
        return;
      }

      const yearlyProfit = investment * (apr / 100);
      const monthlyProfit = yearlyProfit / 12;
      const dailyProfit = yearlyProfit / 365;

      document.getElementById('result').innerHTML = `
        📅 Річний прибуток: <b>$${yearlyProfit.toFixed(2)}</b><br>
        📆 Місячний прибуток: <b>$${monthlyProfit.toFixed(2)}</b><br>
        ☀️ Денний прибуток: <b>$${dailyProfit.toFixed(2)}</b>
      `;
    }
  </script>
</body>
</html>
